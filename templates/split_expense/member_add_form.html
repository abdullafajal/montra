{% extends "base.html" %}

{% block title %}Add Member - {{ group.name }}{% endblock %}

{% block top_bar %}
<div class="px-5 pt-6 pb-2 lg:px-6 lg:pt-8 flex items-center gap-3">
    <a href="{% url 'split_expense:group_detail' group.id %}" class="w-10 h-10 rounded-xl bg-mn-card dark:bg-mn-card-dark flex items-center justify-center shadow-soft hover:shadow-elevated transition-all">
        <span class="material-symbols-outlined icon-md text-mn-text dark:text-mn-text-dark">arrow_back</span>
    </a>
    <h1 class="text-lg font-bold text-mn-text dark:text-mn-text-dark">Add to {{ group.name }}</h1>
</div>
{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-lg mx-auto">
    <form method="post" action="{% url 'split_expense:group_member_add' group.id %}" class="space-y-4">
        {% csrf_token %}
        
        <div class="mn-card p-5 space-y-4">
            <div class="flex justify-center mb-2">
                <div class="w-16 h-16 rounded-2xl bg-mn-bg dark:bg-mn-bg-dark flex items-center justify-center border-2 border-dashed border-mn-border dark:border-mn-border-dark text-mn-muted">
                    <span class="material-symbols-outlined icon-lg">person_add</span>
                </div>
            </div>

            <div>
                <label for="identifier" class="block text-sm font-medium text-mn-text dark:text-mn-text-dark mb-1.5">Username or Email</label>
                <div class="relative">
                    <input type="text" 
                           id="identifier" 
                           name="identifier" 
                           required 
                           autocomplete="off"
                           placeholder="Enter their email or username..." 
                           class="w-full px-4 py-3 bg-white dark:bg-[#1A1A1A] border border-gray-200 dark:border-white/5 rounded-xl shadow-sm focus:ring-2 focus:ring-mn-accent focus:border-transparent transition-all outline-none text-mn-text dark:text-mn-text-dark font-medium placeholder-gray-400 dark:placeholder-gray-600">
                    
                    <!-- Autocomplete Dropdown -->
                    <div id="autocomplete-results" class="absolute z-10 w-full mt-2 bg-mn-card dark:bg-[#1A1A1A] border border-mn-border dark:border-mn-border-dark rounded-xl shadow-elevated hidden overflow-hidden">
                        <!-- Results will be injected here via JS -->
                    </div>
                </div>
                <p class="text-xs text-mn-muted mt-2">
                    Enter a registered username, or an email to send an invite.
                </p>
            </div>
        </div>

        <button type="submit" id="add-member-btn" class="w-full py-3.5 bg-mn-dark text-mn-accent font-semibold rounded-2xl transition-all duration-200 active:scale-[0.98] shadow-soft hover:opacity-90 flex items-center justify-center gap-2">
            <span>Add Member</span>
        </button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('identifier');
        const resultsContainer = document.getElementById('autocomplete-results');
        let timeout = null;

        input.addEventListener('input', function() {
            clearTimeout(timeout);
            const query = this.value.trim();

            if (query.length < 2) {
                resultsContainer.classList.add('hidden');
                return;
            }

            timeout = setTimeout(() => {
                fetch(`/groups/api/users/search/?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        resultsContainer.innerHTML = '';
                        
                        if (data.users && data.users.length > 0) {
                            data.users.forEach(user => {
                                const el = document.createElement('div');
                                el.className = 'px-4 py-3 hover:bg-mn-bg dark:hover:bg-mn-bg-dark cursor-pointer flex items-center gap-3 transition-colors';
                                el.innerHTML = `
                                    <div class="w-8 h-8 rounded-full bg-mn-accent text-mn-dark flex items-center justify-center text-xs font-bold">
                                        ${user.initial}
                                    </div>
                                    <div>
                                        <div class="font-semibold text-sm text-mn-text dark:text-mn-text-dark">${user.username}</div>
                                        <div class="text-xs text-mn-muted">${user.email}</div>
                                    </div>
                                `;
                                el.addEventListener('click', () => {
                                    input.value = user.username; // Or email, both work in our backend
                                    resultsContainer.classList.add('hidden');
                                });
                                resultsContainer.appendChild(el);
                            });
                            resultsContainer.classList.remove('hidden');
                        } else {
                            // If no users found but it looks like an email, we could show a "Invite new email" prompt
                            if (query.includes('@')) {
                                const el = document.createElement('div');
                                el.className = 'px-4 py-3 bg-mn-bg dark:bg-mn-bg-dark flex items-center gap-3 text-mn-muted';
                                el.innerHTML = `
                                    <span class="material-symbols-outlined icon-sm">mail</span>
                                    <div class="text-sm">Send invite email to: <strong>${query}</strong></div>
                                `;
                                el.addEventListener('click', () => {
                                    input.value = query;
                                    resultsContainer.classList.add('hidden');
                                });
                                resultsContainer.appendChild(el);
                                resultsContainer.classList.remove('hidden');
                            } else {
                                resultsContainer.classList.add('hidden');
                            }
                        }
                    })
                    .catch(err => console.error(err));
            }, 300); // 300ms debounce
        });

        // Hide when clicking outside
        document.addEventListener('click', function(e) {
            if (!input.contains(e.target) && !resultsContainer.contains(e.target)) {
                resultsContainer.classList.add('hidden');
            }
        });
        
        // Add Loading Spinner State to Form Submission
        document.querySelector('form').addEventListener('submit', function() {
            const submitBtn = document.getElementById('add-member-btn');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            submitBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-mn-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Sending...</span>`;
        });
    });
</script>
{% endblock %}
