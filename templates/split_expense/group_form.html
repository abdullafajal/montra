{% extends "base.html" %}

{% block title %}Create Group{% endblock %}

{% block top_bar %}
<!-- Header Skeleton -->
<div data-skeleton class="animate-pulse px-5 pt-6 pb-2 lg:px-6 lg:pt-8 flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-mn-card dark:bg-mn-card-dark"></div>
    <div class="w-24 h-5 bg-mn-card dark:bg-mn-card-dark rounded"></div>
</div>
<!-- Header Content -->
<div data-content class="hidden">
<div class="px-5 pt-6 pb-2 lg:px-6 lg:pt-8 flex items-center gap-3">
    <a href="{% url 'split_expense:group_list' %}" class="w-10 h-10 rounded-xl bg-mn-card dark:bg-mn-card-dark flex items-center justify-center shadow-soft hover:shadow-elevated transition-all">
        <span class="material-symbols-outlined icon-md text-mn-text dark:text-mn-text-dark">arrow_back</span>
    </a>
    <h1 class="text-lg font-bold text-mn-text dark:text-mn-text-dark">New Group</h1>
</div>
</div>
{% endblock %}

{% block content %}

<!-- SKELETON LOADER -->
<div data-skeleton class="animate-pulse max-w-lg mx-auto">
    <div class="bg-mn-card dark:bg-mn-card-dark rounded-[20px] p-5 space-y-4 border border-mn-border dark:border-mn-border-dark">
        <!-- Icon Skeleton -->
        <div class="flex justify-center mb-2">
            <div class="w-16 h-16 rounded-2xl bg-mn-border dark:bg-mn-border-dark"></div>
        </div>
        <!-- Label + Input Skeleton -->
        <div>
            <div class="w-24 h-3 bg-mn-border dark:bg-mn-border-dark rounded mb-2"></div>
            <div class="w-full h-11 bg-mn-border dark:bg-mn-border-dark rounded-xl"></div>
            <div class="w-56 h-3 bg-mn-border dark:bg-mn-border-dark rounded mt-2"></div>
        </div>
    </div>
    <!-- Submit Button Skeleton -->
    <div class="w-full h-12 bg-mn-card dark:bg-mn-card-dark rounded-2xl mt-4"></div>
</div>

<!-- ACTUAL CONTENT -->
<div data-content class="hidden">
<div class="animate-fade-in max-w-lg mx-auto">
    <form method="post" action="{% url 'split_expense:group_create' %}" class="space-y-4">
        {% csrf_token %}
        
        <div class="mn-card p-5 space-y-4">
            <div class="flex justify-center mb-2">
                <div class="w-16 h-16 rounded-2xl bg-mn-bg dark:bg-mn-bg-dark flex items-center justify-center border-2 border-dashed border-mn-border dark:border-mn-border-dark text-mn-muted">
                    <span class="material-symbols-outlined icon-lg">groups</span>
                </div>
            </div>

            <div>
                <label for="name" class="block text-sm font-medium text-mn-text dark:text-mn-text-dark mb-1.5">Group Name</label>
                <div class="relative">
                    <input type="text" 
                           id="name" 
                           name="name" 
                           required 
                           placeholder="e.g. Goa Trip, Office Lunch" 
                           class="w-full px-4 py-3 bg-white dark:bg-[#1A1A1A] border border-gray-200 dark:border-white/5 rounded-xl shadow-sm focus:ring-2 focus:ring-mn-accent focus:border-transparent transition-all outline-none text-mn-text dark:text-mn-text-dark font-medium placeholder-gray-400 dark:placeholder-gray-600">
                </div>
                <p class="text-xs text-mn-muted mt-2">You can add members after creating the group.</p>
            </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-mn-dark text-mn-accent font-semibold rounded-2xl transition-all duration-200 active:scale-[0.98] shadow-soft hover:opacity-90">
            Create Group
        </button>
    </form>
</div>
</div>
{% endblock %}
